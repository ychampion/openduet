# Add to the base file with -f docker-compose.yml -f docker-compose.blobs-s3.yml,
# or set "blobs": { "store": "s3", ... } in deploy/openduet.deploy.json and the
# openduet command adds it. The service keeps the files it stores by their content
# in the S3-compatible bucket deploy/.env names (AWS S3, Cloudflare R2, MinIO and
# the like) instead of on the artifacts volume. The bucket and its keys are
# required here, so Compose refuses to start a stack that would lack them. The
# keys stay with the service and never reach an agent's computer.
services:
  openduet:
    environment:
      OPENDUET_BLOB_STORE: s3
      # Empty is AWS S3 for the region.
      OPENDUET_BLOB_S3_ENDPOINT: ${OPENDUET_BLOB_S3_ENDPOINT:-}
      OPENDUET_BLOB_S3_BUCKET: ${OPENDUET_BLOB_S3_BUCKET:?set the bucket with bun run openduet set OPENDUET_BLOB_S3_BUCKET=<name>}
      OPENDUET_BLOB_S3_REGION: ${OPENDUET_BLOB_S3_REGION:-}
      OPENDUET_BLOB_S3_PREFIX: ${OPENDUET_BLOB_S3_PREFIX:-}
      OPENDUET_BLOB_S3_ACCESS_KEY_ID: ${OPENDUET_BLOB_S3_ACCESS_KEY_ID:?run bun run openduet set --from-env OPENDUET_BLOB_S3_ACCESS_KEY_ID}
      OPENDUET_BLOB_S3_SECRET_ACCESS_KEY: ${OPENDUET_BLOB_S3_SECRET_ACCESS_KEY:?run bun run openduet set --from-env OPENDUET_BLOB_S3_SECRET_ACCESS_KEY}

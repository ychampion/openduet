name: Bug report
description: Get help with installation or report unexpected behavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report security problems privately through the repository's Security tab, as described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows it, including the screen or command you used.
      placeholder: |
        1. Installed with the one-line installer on ...
        2. Opened ...
        3. Expected ... but saw ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or revision
      description: The release or image tag you installed (for example v0.3.0 or main), or the source commit from `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Installation method, operating system, Docker/Compose versions, and browser. For model issues, include provider and model name. For source development, include Bun version and relevant `bun run doctor` output. Do not paste API keys, setup links, passwords or personal content.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, with credentials and personal data removed.
      render: text
